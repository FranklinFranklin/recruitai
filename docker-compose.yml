services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruit_admin
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: recruit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
