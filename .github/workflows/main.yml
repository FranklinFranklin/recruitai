name: RecruitAI CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript Compiler Check (Type-safe validation)
      run: npx tsc --noEmit

    # Uncomment when Vitest and Playwright are configured in Phase 2
    # - name: Run Unit Tests (Vitest)
    #   run: npx vitest run
    # 
    # - name: Install Playwright Browsers
    #   run: npx playwright install --with-deps
    # 
    # - name: Run E2E Tests (Playwright)
    #   run: npx playwright test

    - name: Audit for Vulnerabilities
      run: npm audit
